<!doctype html>
<html lang="pl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<meta name="referrer" content="no-referrer">
<title>OLX Manager – autoryzacja</title>
<style>
:root { --bg: #f4f6f8; --panel: #fff; --text: #16202a; --muted: #66737f; --line: #e3e8ec; --accent: #0b7d6f; }
@media (prefers-color-scheme: dark) { :root { --bg: #0f1418; --panel: #161d22; --text: #e4eaee; --muted: #8d9ba6; --line: #26323a; --accent: #2fb5a2; } }
body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: var(--bg); color: var(--text);
font: 15px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; padding: 16px; box-sizing: border-box; }
.card { background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 24px; width: min(560px, 100%); }
h1 { font-size: 18px; margin: 0 0 8px; }
p { color: var(--muted); margin: 8px 0; }
textarea { width: 100%; box-sizing: border-box; font: 12px monospace; padding: 8px; border-radius: 8px;
border: 1px solid var(--line); background: var(--bg); color: var(--text); }
button { margin-top: 10px; padding: 8px 14px; border: 0; border-radius: 8px; background: var(--accent); color: #fff;
font: inherit; font-weight: 600; cursor: pointer; }
.hidden { display: none; }
</style>
</head>
<body>
<div class="card">
<h1 id="title">Przekazuję autoryzację do panelu…</h1>
<p id="info">Za chwilę otworzy się OLX Manager na Twoim komputerze.</p>
<div id="fallback" class="hidden">
<p>Jeśli panel się nie otworzył (np. działa pod innym adresem), skopiuj poniższy adres i wklej go w panelu:
<b>Konta → Wklej adres autoryzacji</b>.</p>
<textarea id="url" rows="4" readonly></textarea>
<button id="copy">Kopiuj adres</button>
</div>
</div>
<script>
// Adres Twojego lokalnego panelu. Zmień, jeśli używasz innego portu/hosta.
var LOCAL_CALLBACK = "http://localhost:8077/api/oauth/callback";

var q = location.search;
var hasCode = /[?&](code|error)=/.test(q);
document.getElementById("url").value = location.href;
document.getElementById("copy").onclick = function () {
var t = document.getElementById("url");
t.select();
(navigator.clipboard ? navigator.clipboard.writeText(t.value) : Promise.reject()).catch(function () { document.execCommand("copy"); });
this.textContent = "Skopiowano";
};
if (hasCode) {
location.replace(LOCAL_CALLBACK + q);
setTimeout(function () { document.getElementById("fallback").classList.remove("hidden"); }, 2500);
} else {
document.getElementById("title").textContent = "OLX Manager – adres przekierowania";
document.getElementById("info").textContent = "Ta strona odbiera autoryzację z OLX i przekazuje ją do lokalnego panelu. Działa – możesz podać ten adres jako Redirect URI w developer.olx.pl.";
}
</script>
</body>
</html>
